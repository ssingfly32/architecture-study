spring.application.name=architecture-study

# 테이블은 schema.sql로 직접 만들고, Hibernate는 엔티티랑 실제 스키마가 일치하는지 검증만 함
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 외부 DB(PostgreSQL)에서도 schema.sql이 항상 실행되도록 설정 (기본값은 내장 DB에서만 실행됨)
spring.sql.init.mode=always

# 부하테스트 중 서버 리소스(JVM 힙, CPU 등)를 /actuator/metrics로 조회하기 위함.
# 기본값은 health 정도만 노출되므로 metrics를 명시적으로 열어줘야 함.
management.endpoints.web.exposure.include=health,metrics

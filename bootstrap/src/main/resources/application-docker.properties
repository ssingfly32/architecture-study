# 앱 자체가 Docker 컨테이너 안에서 실행될 때 쓰는 프로필.
# DB 접속 정보는 코드에 없고, docker-compose가 컨테이너 환경변수로 주입해준다.
# host가 localhost가 아니라 "postgres"인 이유: 같은 docker-compose 네트워크 안에서는
# 서비스 이름(postgres)이 곧 호스트명이 되기 때문.
spring.datasource.url=jdbc:postgresql://postgres:5432/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
